# BEGIN Despertar LP principal
# Gerenciado pela publicacao de genosgroup/lp-despertar-principal
# (hospedagem/htaccess-raiz.conf). Nao edite aqui: a proxima publicacao
# substitui este bloco. O resto deste arquivo (WordPress) nao e tocado.
#
# O "/" abre a home nova (index.html) em vez do WordPress (index.php). Os
# outros enderecos que nao sao arquivo nem pasta continuam indo para o WordPress.
DirectoryIndex index.html index.php
<IfModule mod_headers.c>
  # As paginas novas sempre conferem se mudaram, para uma publicacao valer na hora.
  <Files "index.html">
    Header set Cache-Control "no-cache"
  </Files>
</IfModule>
# END Despertar LP principal
